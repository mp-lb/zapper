name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PM2
        run: npm install -g pm2

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Load npm publish token
        env:
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/zapper-secrets.txt"
          npx -y @mp-lb/doctrine-secrets decrypt proj/secrets.txt.enc --secret "$SECRETS_KEY" > "$secrets_file"

          SECRETS_FILE="$secrets_file" node <<'NODE'
          const fs = require("fs");
          const file = process.env.SECRETS_FILE;
          const githubEnv = process.env.GITHUB_ENV;
          const content = fs.readFileSync(file, "utf8");

          function parseSecrets(text) {
            const trimmed = text.trim();
            if (!trimmed) return {};
            if (trimmed.startsWith("{")) return JSON.parse(trimmed);

            const values = {};
            for (const rawLine of text.split(/\r?\n/)) {
              const line = rawLine.trim();
              if (!line || line.startsWith("#")) continue;

              const match = line.match(/^([A-Z0-9_]+)\s*(=|:)\s*(.*)$/);
              if (!match) {
                throw new Error(`Invalid secrets line for key export: ${rawLine}`);
              }

              const [, key, , rawValue] = match;
              values[key] = rawValue.replace(/^"(.*)"$/, "$1");
            }
            return values;
          }

          const secrets = parseSecrets(content);
          const token = secrets.NPM_TOKEN;

          if (!token || typeof token !== "string") {
            throw new Error("NPM_TOKEN is required in proj/secrets.txt.enc");
          }

          console.log(`::add-mask::${token}`);
          fs.appendFileSync(
            githubEnv,
            `NPM_TOKEN<<__ZAPPER_NPM_TOKEN__\n${token}\n__ZAPPER_NPM_TOKEN__\n` +
              `NODE_AUTH_TOKEN<<__ZAPPER_NPM_TOKEN__\n${token}\n__ZAPPER_NPM_TOKEN__\n`,
          );
          NODE

      - name: Verify npm publish auth
        run: |
          set -euo pipefail

          token_len=${#NPM_TOKEN}
          token_fingerprint=$(printf '%s' "$NPM_TOKEN" | shasum -a 256 | cut -c1-12)
          tmp_npmrc="$(mktemp)"
          trap 'rm -f "$tmp_npmrc"' EXIT
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$tmp_npmrc"

          echo "NPM_TOKEN length: ${token_len}"
          echo "NPM_TOKEN sha256 prefix: ${token_fingerprint}"
          echo "npm whoami: $(NPM_CONFIG_USERCONFIG="$tmp_npmrc" npm whoami)"

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "chore: release"
          commit: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
