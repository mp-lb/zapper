name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "apps/landing-page/**"
      - "docs/**"
      - "infra/**"
      - "docs/secrets.json.enc"
      - ".github/workflows/deploy.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_NAME: zapper

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt deployment secrets
        env:
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
        run: |
          set -euo pipefail
          npx -y @mp-lb/doctrine-secrets decrypt docs/secrets.json.enc --secret "$SECRETS_KEY" > secrets.json
          npx -y @mp-lb/tools-env-mapper github-env deployment \
            --secrets secrets.json \
            --public .env.production \
            --map deployment/env-map.yaml \
            --gcp-credentials "$RUNNER_TEMP/gcp-sa-key.json"
          rm -f secrets.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: infra
        run: |
          set -euo pipefail

          terraform init \
            -backend-config="bucket=$GCP_PROJECT_ID-terraform-state" \
            -backend-config="prefix=terraform/state/${{ env.PROJECT_NAME }}"

      - name: Terraform Apply
        working-directory: infra
        run: |
          set -euo pipefail

          terraform apply -auto-approve -lock-timeout=10m \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="vercel_api_token=$VERCEL_API_TOKEN" \
            -var="cloudflare_api_token=$CLOUDFLARE_API_TOKEN" \
            -var="desktop_releases_github_token=${DESKTOP_RELEASES_GITHUB_TOKEN:-}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing page
        run: pnpm --filter=@mp-lb/zapper-landing-page build

      - name: Build docs
        run: pnpm --filter=@mp-lb/zapper-docs build

      - name: Get Vercel IDs
        id: vercel
        working-directory: infra
        run: |
          set -euo pipefail

          echo "landing_project_id=$(terraform output -raw vercel_project_id)" >> "$GITHUB_OUTPUT"
          echo "docs_project_id=$(terraform output -raw docs_vercel_project_id)" >> "$GITHUB_OUTPUT"

          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            echo "org_id=$VERCEL_ORG_ID" >> "$GITHUB_OUTPUT"
          else
            ORG_ID=$(curl -fsS -H "Authorization: Bearer $VERCEL_API_TOKEN" https://api.vercel.com/v2/user | jq -r '.user.id')
            echo "org_id=$ORG_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Build landing page for Vercel
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          npx vercel build --prod --yes --token="$VERCEL_API_TOKEN"
        env:
          VERCEL_PROJECT_ID: ${{ steps.vercel.outputs.landing_project_id }}
          VERCEL_ORG_ID: ${{ steps.vercel.outputs.org_id }}

      - name: Deploy landing page to Vercel
        run: |
          set -euo pipefail
          npx vercel deploy --prebuilt --prod --yes --token="$VERCEL_API_TOKEN"
        env:
          VERCEL_PROJECT_ID: ${{ steps.vercel.outputs.landing_project_id }}
          VERCEL_ORG_ID: ${{ steps.vercel.outputs.org_id }}

      - name: Deploy docs to Vercel
        working-directory: docs
        run: |
          set -euo pipefail
          npx vercel deploy --prod --yes --token="$VERCEL_API_TOKEN"
        env:
          VERCEL_PROJECT_ID: ${{ steps.vercel.outputs.docs_project_id }}
          VERCEL_ORG_ID: ${{ steps.vercel.outputs.org_id }}

      - name: Show outputs
        working-directory: infra
        run: terraform output
