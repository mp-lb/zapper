# Generated by arcnet secrets; configure sources in .arcnet/arcnet.yaml.
name: Validate ArcNet secrets
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .arcnet/**
      - .github/workflows/validate-arcnet-secrets.yaml
      - package.json
      - pnpm-lock.yaml
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'mp-lb/zapper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Decrypt, merge and validate selected keys
        run: pnpm exec arcnet env check
        env:
          ARCNET_STANDARD_SECRETS_KEY: ${{ secrets.ARCNET_STANDARD_SECRETS_KEY }}
