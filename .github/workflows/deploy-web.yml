name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "apps/landing-page/**"
      - "docs/**"
      - "infra/**"
      - "docs/secrets.txt.enc"
      - ".github/workflows/deploy-web.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch:

env:
  PROJECT_NAME: zapper

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decrypt deployment secrets
        env:
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/zapper-secrets.txt"
          npx -y @mp-lb/doctrine-secrets decrypt docs/secrets.txt.enc --secret "$SECRETS_KEY" > "$secrets_file"

          SECRETS_FILE="$secrets_file" node <<'NODE'
          const fs = require("fs");
          const file = process.env.SECRETS_FILE;
          const githubEnv = process.env.GITHUB_ENV;
          const content = fs.readFileSync(file, "utf8");

          function parseSecrets(text) {
            const trimmed = text.trim();
            if (!trimmed) return {};
            if (trimmed.startsWith("{")) return JSON.parse(trimmed);

            const values = {};
            for (const rawLine of text.split(/\r?\n/)) {
              const line = rawLine.trim();
              if (!line || line.startsWith("#")) continue;

              const match = line.match(/^([A-Z0-9_]+)\s*(=|:)\s*(.*)$/);
              if (!match) {
                throw new Error(`Invalid secrets line for key export: ${rawLine}`);
              }

              const [, key, , rawValue] = match;
              values[key] = rawValue.replace(/^"(.*)"$/, "$1");
            }
            return values;
          }

          for (const [key, rawValue] of Object.entries(parseSecrets(content))) {
            if (!/^[A-Z0-9_]+$/.test(key)) {
              throw new Error(`Invalid secret key: ${key}`);
            }
            const value = typeof rawValue === "string" ? rawValue : JSON.stringify(rawValue);
            if (value) console.log(`::add-mask::${value}`);

            fs.appendFileSync(
              githubEnv,
              `${key}<<__ZAPPER_SECRET_${key}__\n${value}\n__ZAPPER_SECRET_${key}__\n`,
            );
          }
          NODE

      - name: Prepare Google Cloud credentials
        run: |
          set -euo pipefail

          credentials_file="$RUNNER_TEMP/gcp-sa-key.json"
          GCP_CREDENTIALS_FILE="$credentials_file" node <<'NODE'
          const fs = require("fs");

          const value = process.env.GCP_SA_KEY || "";
          if (!value) {
            throw new Error("GCP_SA_KEY is required in docs/secrets.txt.enc");
          }

          let credentials = value;
          if (!value.trim().startsWith("{")) {
            const decoded = Buffer.from(value, "base64").toString("utf8");
            if (decoded.trim().startsWith("{")) credentials = decoded;
          }

          fs.writeFileSync(process.env.GCP_CREDENTIALS_FILE, credentials);

          const parsed = JSON.parse(credentials);
          if (!process.env.GCP_PROJECT_ID && parsed.project_id) {
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `GCP_PROJECT_ID=${parsed.project_id}\n`,
            );
          }
          NODE

          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: infra
        run: |
          set -euo pipefail

          terraform init \
            -backend-config="bucket=$GCP_PROJECT_ID-terraform-state" \
            -backend-config="prefix=terraform/state/${{ env.PROJECT_NAME }}"

      - name: Terraform Apply
        working-directory: infra
        run: |
          set -euo pipefail

          terraform apply -auto-approve \
            -var="project_name=${{ env.PROJECT_NAME }}" \
            -var="vercel_api_token=$VERCEL_API_TOKEN" \
            -var="cloudflare_api_token=$CLOUDFLARE_API_TOKEN" \
            -var="desktop_releases_github_token=${DESKTOP_RELEASES_GITHUB_TOKEN:-}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build landing page
        run: pnpm --filter=@mp-lb/zapper-landing-page build

      - name: Build docs
        run: pnpm --filter=@mp-lb/zapper-docs build

      - name: Get Vercel IDs
        id: vercel
        working-directory: infra
        run: |
          set -euo pipefail

          echo "landing_project_id=$(terraform output -raw vercel_project_id)" >> "$GITHUB_OUTPUT"
          echo "docs_project_id=$(terraform output -raw docs_vercel_project_id)" >> "$GITHUB_OUTPUT"

          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            echo "org_id=$VERCEL_ORG_ID" >> "$GITHUB_OUTPUT"
          else
            ORG_ID=$(curl -fsS -H "Authorization: Bearer $VERCEL_API_TOKEN" https://api.vercel.com/v2/user | jq -r '.user.id')
            echo "org_id=$ORG_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Build landing page for Vercel
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          npx vercel build --prod --yes --token="$VERCEL_API_TOKEN"
        env:
          VERCEL_PROJECT_ID: ${{ steps.vercel.outputs.landing_project_id }}
          VERCEL_ORG_ID: ${{ steps.vercel.outputs.org_id }}

      - name: Deploy landing page to Vercel
        run: |
          set -euo pipefail
          npx vercel deploy --prebuilt --prod --yes --token="$VERCEL_API_TOKEN"
        env:
          VERCEL_PROJECT_ID: ${{ steps.vercel.outputs.landing_project_id }}
          VERCEL_ORG_ID: ${{ steps.vercel.outputs.org_id }}

      - name: Deploy docs to Vercel
        working-directory: docs
        run: |
          set -euo pipefail
          npx vercel deploy --prod --yes --token="$VERCEL_API_TOKEN"
        env:
          VERCEL_PROJECT_ID: ${{ steps.vercel.outputs.docs_project_id }}
          VERCEL_ORG_ID: ${{ steps.vercel.outputs.org_id }}

      - name: Show outputs
        working-directory: infra
        run: terraform output
