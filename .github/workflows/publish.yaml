name: Release npm packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:


permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mp-lb/zapper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: npm install -g pm2
      - run: pnpm build && pnpm docs:check && pnpm lint && pnpm test
      - name: Publish changed package builds
        run: pnpm exec arcnet env run --consumer publish -- node
          scripts/auto-publish.mjs
        env:
          ARCNET_STANDARD_SECRETS_KEY: ${{ secrets.ARCNET_STANDARD_SECRETS_KEY }}
          ZAPPER_SECRETS_KEY: ${{ secrets.ZAPPER_SECRETS_KEY }}
      - name: Verify exact public versions
        run: node scripts/verify-publication.mjs
