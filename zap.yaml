project: zapper
env-files:
  - .env.local
  - .env
native:
  dev:
    cmd: pnpm dev
    env: "*"
tasks:
  setup:
    cmds:
      - pnpm install
  build:
    cmds:
      - pnpm build
  test:
    cmds:
      - pnpm test
  lint:
    cmds:
      - pnpm lint
  compile-agents:
    cmds:
      - npx -y @mp-lb/mdcompile agents-md/index.md -o AGENTS.md --optional --silent
      - npx -y @mp-lb/mdcompile agents-md/index.md -o CLAUDE.md --optional --silent
