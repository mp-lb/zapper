project: zapper
env-files:
  - .env.local
  - .env
native:
  dev:
    cmd: pnpm dev
    env: "*"
tasks:
  scripts:
    desc: Introduce this project
    cmds:
      - pnpm --dir packages/scripts exec tsx index.ts
  scripts-check:
    desc: Lint and typecheck project scripts
    cmds:
      - pnpm exec eslint packages/scripts packages/cli/scripts
      - pnpm --dir packages/scripts run typecheck
      - pnpm --filter @mp-lb/zapper typecheck
  secrets-unlock:
    cmds:
      - dx decrypt --file docs/env.local.enc > .env
  secrets-lock:
    cmds:
      - dx encrypt --file .env > docs/env.local.enc
  secrets-check:
    cmds:
      - |
        dx decrypt --file docs/env.local.enc > /tmp/.env.check 2>/dev/null || { echo "no docs/env.local.enc"; exit 0; }
        if ! diff -q /tmp/.env.check .env >/dev/null 2>&1; then echo "WARN: .env differs from docs/env.local.enc - run: zap t secrets-lock"; rm -f /tmp/.env.check; exit 1; fi
        rm -f /tmp/.env.check; echo "secrets in sync"
  setup:
    cmds:
      - pnpm install
  build:
    cmds:
      - pnpm build
  test:
    cmds:
      - pnpm test
  lint:
    cmds:
      - pnpm lint
  context-build:
    cmds:
      - |
        set -eu
        context_temp=$(mktemp -d)
        trap 'rm -rf "$context_temp"' EXIT
        mdcompile context/index.md --silent -o "$context_temp/local.md"
        fm compile --stdin -o "$context_temp/shared.md" < "$context_temp/local.md"
        cp "$context_temp/shared.md" AGENTS.md
        cp "$context_temp/shared.md" CLAUDE.md
  scripts-test:
    cmds:
      - pnpm --dir packages/scripts test
      - pnpm --filter @mp-lb/zapper test scripts
  publish-packages:
    cmds:
      - pnpm exec tsx packages/scripts/autoPublish.ts {{REST}}
  verify-publication:
    cmds:
      - pnpm exec tsx packages/scripts/verifyPublication.ts {{REST}}
  add-js-extensions:
    cmds:
      - pnpm exec tsx packages/scripts/addJsExtensions.ts {{REST}}
  inject-analytics-config:
    cmds:
      - pnpm exec tsx packages/cli/scripts/injectAnalyticsConfig.ts {{REST}}
  e2e-setup:
    cmds:
      - pnpm exec tsx packages/cli/scripts/e2eSetup.ts {{REST}}
  e2e:
    cmds:
      - pnpm exec tsx packages/cli/scripts/e2eRun.ts {{REST}}
  e2e-fixture:
    cmds:
      - pnpm exec tsx packages/cli/scripts/createWorktreeFixture.ts {{REST}}
  docs-gen:
    cmds:
      - pnpm exec tsx packages/cli/scripts/gen-cli-docs.ts {{REST}}
  docs-check:
    cmds:
      - pnpm exec tsx packages/cli/scripts/gen-cli-docs.ts --check {{REST}}
