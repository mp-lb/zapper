project: zapper
env-files:
  - .env.local
  - .env
native:
  dev:
    cmd: pnpm dev
    env: "*"
tasks:
  scripts:
    desc: Introduce this project
    cmds:
      - pnpm --dir packages/scripts exec tsx index.ts
  scripts-check:
    desc: Lint and typecheck project scripts
    cmds:
      - pnpm exec eslint packages/scripts
      - pnpm --dir packages/scripts run typecheck
  secrets-unlock:
    cmds:
      - dx decrypt --file docs/env.local.enc > .env
  secrets-lock:
    cmds:
      - dx encrypt --file .env > docs/env.local.enc
  secrets-check:
    cmds:
      - |
        dx decrypt --file docs/env.local.enc > /tmp/.env.check 2>/dev/null || { echo "no docs/env.local.enc"; exit 0; }
        if ! diff -q /tmp/.env.check .env >/dev/null 2>&1; then echo "WARN: .env differs from docs/env.local.enc - run: zap t secrets-lock"; rm -f /tmp/.env.check; exit 1; fi
        rm -f /tmp/.env.check; echo "secrets in sync"
  setup:
    cmds:
      - pnpm install
  build:
    cmds:
      - pnpm build
  test:
    cmds:
      - pnpm test
  lint:
    cmds:
      - pnpm lint
  context-copy:
    cmds:
      - pnpm exec tsx packages/scripts/contextFiles.ts copy {{REST}}
  context-build:
    cmds:
      - pnpm exec tsx packages/scripts/contextFiles.ts build {{REST}}
